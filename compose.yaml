services:
  observatory:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - observatory_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  observatory_data:
