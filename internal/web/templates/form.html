{{define "form.html"}}{{template "head" .}}<div class="heading"><h1>{{.Title}}</h1><a href="/">← Назад</a></div><div class="card formcard">{{if .Error}}<p class="alert">{{.Error}}</p>{{end}}<form method="post" action="{{if .Editing}}/monitors/{{.Monitor.ID}}/edit{{else}}/monitors{{end}}" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Название<input name="name" maxlength="100" value="{{.Monitor.Name}}" required placeholder="Мой сайт"></label><label>URL<input name="url" type="url" maxlength="2048" value="{{.Monitor.URL}}" required placeholder="https://example.org/"></label><div class="twocol"><label>Интервал (сек.)<input name="interval" type="number" min="15" max="86400" value="{{.Monitor.Interval}}" required></label><label>Тайм-аут (сек.)<input name="timeout" type="number" min="1" max="60" value="{{.Monitor.Timeout}}" required></label></div><label>Окончание регистрации домена (необязательно)<input name="domain_expiry" type="date" value="{{.Domain.ManualDate}}"></label><p class="muted">По умолчанию дата определяется через RDAP. Ручная дата имеет приоритет и применяется ко всем мониторам этого домена. Если дата неизвестна — оставьте поле пустым.</p><label class="check"><input type="checkbox" name="enabled" {{if .Monitor.Enabled}}checked{{end}}> Проверять автоматически</label><button class="primary">Сохранить</button></form></div>{{template "foot" .}}{{end}}
