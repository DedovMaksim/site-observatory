{{define "login.html"}}{{template "head" .}}<section class="auth card"><h1>Вход</h1><p class="muted">Панель доступна только администратору.</p>{{if .Error}}<p class="alert">{{.Error}}</p>{{end}}<form method="post" action="/login" class="stack"><label>Логин<input name="username" value="admin" required autocomplete="username"></label><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label><button class="primary">Войти</button></form></section>{{template "foot" .}}{{end}}
